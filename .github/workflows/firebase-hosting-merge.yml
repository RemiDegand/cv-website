# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    # Private files only (not deployed, see firebase.json "ignore"): no site deploy needed (Platform & Data, 13 Nov 2026).
    # Ada (functions/, knowledge/) is still deployed by hand: firebase deploy --only functions
    paths-ignore:
      - "docs/**"
      - "knowledge/**"
      - "functions/**"
      - "analytics/**"
      - "tools/**"
      - "content/**"
      - "**.md"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMI_DEGAND_CV }}
          channelId: live
          projectId: remi-degand-cv
